<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COLD CASE · LUVLINK</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f3350;
  --ink-soft:#6c7f9c;
  --blue:#6aa6ff;
  --blue-deep:#3f6fd0;
  --glass:linear-gradient(160deg,rgba(255,255,255,.92),rgba(226,238,255,.72));
  --edge:rgba(255,255,255,.9);
  --shadow:0 10px 30px rgba(110,150,220,.22), inset 0 1px 0 #fff;
  --c1:#cfdcf5; --c2:#4a6aa8;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:var(--mono);color:var(--ink);
  background:
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.95) 1.2px,transparent 1.6px) 0 0/22px 22px,
    linear-gradient(180deg,#eef3fb,#e9eff9 60%,#eaf0fa);
  overflow-x:hidden;
}
/* 배경 블러 덩어리 */
.blob{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.b1{width:420px;height:300px;left:-60px;top:110px;background:#9cc3ff;opacity:.55}
.b2{width:380px;height:380px;right:-120px;top:230px;background:#d7c6ff;opacity:.55}
.b3{width:420px;height:260px;right:-60px;bottom:-40px;background:#a9ccff;opacity:.6}
.b4{width:360px;height:220px;left:15%;top:55%;background:#c7ecec;opacity:.35}
.spark{position:fixed;color:#8fc2ff;z-index:1;animation:tw 3s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

main{position:relative;z-index:2;width:min(440px,100% - 32px);margin:0 auto;padding:30px 0 70px;display:flex;flex-direction:column;align-items:center}

/* 탭 달린 글래스 카드 공통 */
.wrap{position:relative;width:100%}
.tab{
  position:absolute;left:0;top:0;transform:translateY(-100%);
  padding:7px 16px 6px;font-size:9.5px;letter-spacing:.2em;font-weight:500;
  background:var(--glass);border:1px solid var(--edge);border-bottom:none;
  border-radius:14px 14px 0 0;box-shadow:0 -4px 14px rgba(120,160,230,.12);color:var(--ink)
}
.card{
  background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}

/* 프로필 */
.profile{margin-top:22px}
.profile .card{border-radius:0 26px 26px 26px;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;height:54px}
.avatar{width:46px;height:46px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#fff,#a8c9ff);box-shadow:0 0 0 2px #fff,0 3px 10px rgba(80,130,220,.35);flex:none}
.avatar i{display:block;width:100%;height:100%;border-radius:50%;background:center/cover,radial-gradient(circle at 30% 30%,#fff,#9fb7e8 45%,#3a4f80)}
.pname{font-family:var(--sans);font-weight:700;font-size:14px;letter-spacing:.01em}
.phandle{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.links-ico{margin-left:auto;align-self:flex-start;margin-top:-2px;opacity:.55}

/* 보이스 레코더 */
.recorder{margin-top:46px;width:min(300px,100%)}
.recorder .tab{font-weight:500}
.recorder .card{border-radius:0 26px 26px 26px;padding:16px 20px 12px;position:relative}
.model{font-size:7.5px;letter-spacing:.2em;color:var(--ink-soft);margin-bottom:8px;display:flex;justify-content:space-between}
.model .dots{width:56px;height:6px;background:radial-gradient(circle,#b9cdee 1px,transparent 1.4px) 0 0/5px 6px;opacity:.7}

.tape-view{
  position:relative;border-radius:16px;padding:6px;
  background:linear-gradient(145deg,#fff,#dfe9fb);
  box-shadow:inset 0 0 0 1px #fff,0 6px 14px rgba(90,130,210,.25)
}
.tape-bg{
  position:relative;border-radius:11px;overflow:hidden;aspect-ratio:240/140;
  background:
    linear-gradient(115deg,transparent 18%,rgba(255,255,255,.55) 30%,transparent 42%),
    repeating-radial-gradient(ellipse at 22% 18%,rgba(255,255,255,.38) 0 1px,transparent 1px 6px),
    linear-gradient(150deg,var(--c1),var(--c2));
  transition:background .5s
}
.tape-bg::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 22px rgba(20,40,90,.35);border-radius:11px;pointer-events:none}
.tape-bg svg{position:absolute;inset:0;width:100%;height:100%}
.tape-bg.swap{animation:swap .45s ease}
@keyframes swap{0%{transform:translateX(14px);opacity:.2}100%{transform:none;opacity:1}}

.reel{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite;animation-play-state:paused}
.reel.r2{animation-duration:3.1s}
body.playing .reel{animation-play-state:running}
body.ff .reel{animation-duration:.5s!important}
body.rew .reel{animation-duration:.5s!important;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}

.status-row{display:flex;align-items:center;gap:14px;margin:14px 0 12px}
.pill{font-size:10.5px;letter-spacing:.28em;padding:6px 16px;border-radius:99px;background:linear-gradient(#fff,#e7f0ff);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 2px 6px rgba(100,140,210,.2);font-weight:500;min-width:66px;text-align:center}
.eq{flex:1;height:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:2px}
.eq b{display:block;width:3px;border-radius:2px;background:linear-gradient(#a9cdff,#5b97ff);height:14%;transition:height .25s}
body.playing .eq b{animation:eq 1s ease-in-out infinite alternate}
@keyframes eq{from{height:12%}to{height:100%}}
.rec-pill{display:flex;align-items:center;gap:6px;font-size:7.5px;letter-spacing:.18em;font-weight:500;padding:5px 9px 5px 6px;border-radius:99px;background:linear-gradient(#fff,#eaf1ff);box-shadow:inset 0 0 0 1px #fff,0 2px 6px rgba(100,140,210,.2);color:#d33}
.rec-pill i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#e8483f 0 35%,#fff 38% 55%,#f3b0ab 58%)}
body.recording .rec-pill i{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}

.ctrls{display:flex;justify-content:space-between;padding:0 2px}
.ctrls button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--mono);font-size:5.5px;letter-spacing:.2em;color:var(--ink-soft)}
.ctrls .btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#fff,#e6efff);box-shadow:0 3px 8px rgba(90,130,210,.28),inset 0 0 0 1px #fff;transition:.15s}
.ctrls button:hover .btn{transform:translateY(-1px)}
.ctrls button:active .btn{transform:scale(.93)}
.ctrls .play .btn{width:36px;height:36px;box-shadow:0 0 0 1.5px var(--blue),0 3px 10px rgba(90,150,255,.4)}
.ctrls svg{width:13px;height:13px;fill:var(--ink)}
.ctrls .recdot{width:9px;height:9px;border-radius:50%;background:#e8483f}
body.recording .ctrls .rec .btn{box-shadow:0 0 0 1.5px #e8483f,0 3px 10px rgba(230,70,60,.35)}
.foot{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:5.5px;letter-spacing:.3em;color:var(--ink-soft)}
.foot span{flex:1;text-align:center;padding-right:14px}

/* 타이틀 */
.title{margin-top:26px;text-align:center}
.title h1{font-size:17px;letter-spacing:.3em;font-weight:500;padding-left:.3em}
.title p{margin-top:18px;font-size:10.5px;letter-spacing:.2em;color:#5f7391;line-height:1.7}
.title .bar{width:200px;height:2px;background:linear-gradient(90deg,transparent,#7aa7ee 15%,#7aa7ee 85%,transparent);margin:14px auto 0;border-radius:2px}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 카세트 캐러셀 */
.stack{position:relative;width:300px;height:96px;margin-top:26px;left:-8px}
.mini{
  position:absolute;top:8px;left:0;width:86px;height:62px;border-radius:3px;padding:4px;cursor:pointer;
  background:linear-gradient(#fff,#eaf1ff);box-shadow:0 6px 14px rgba(90,130,210,.3),0 0 0 1px rgba(255,255,255,.9);
  transition:transform .45s cubic-bezier(.3,.8,.3,1),opacity .4s;border:0;font-family:var(--mono)
}
.mini .m-bg{display:block;height:40px;border-radius:2px;position:relative;overflow:hidden;
  background:repeating-radial-gradient(ellipse at 22% 18%,rgba(255,255,255,.3) 0 1px,transparent 1px 5px),linear-gradient(150deg,var(--a),var(--b))}
.mini svg{position:absolute;inset:0;width:100%;height:100%}
.mini em{display:block;font-style:normal;font-size:6.5px;letter-spacing:.2em;margin-top:6px;color:var(--ink);text-align:center}
.mini.active{box-shadow:0 0 0 1.5px var(--blue),0 8px 18px rgba(80,130,230,.4)}

/* 페이저 */
.pager{display:flex;align-items:center;gap:9px;margin-top:22px}
.pg-arrow{width:56px;height:40px;border:0;cursor:pointer;border-radius:14px;background:var(--glass);box-shadow:var(--shadow);font-family:var(--mono);font-size:6.5px;letter-spacing:.25em;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;transition:.15s}
.pg-arrow b{font-size:8px;letter-spacing:.1em;color:var(--ink)}
.pg-arrow:active{transform:scale(.95)}
.pg-num{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(#fff,#eaf2ff);box-shadow:0 2px 6px rgba(100,140,210,.22);font-family:var(--mono);font-size:8px;color:var(--ink-soft);transition:.2s}
.pg-num.on{width:34px;height:34px;color:var(--ink);font-weight:500;box-shadow:0 0 0 1.5px var(--blue),0 3px 10px rgba(90,150,255,.35)}

/* 링크 바 */
.linkbar{margin-top:22px;width:100%;border-radius:22px;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px}
.linkbar .th{width:50px;height:34px;padding:3px;background:#fff;border-radius:2px;box-shadow:0 2px 6px rgba(90,130,210,.25);flex:none}
.linkbar .th div{width:100%;height:100%;position:relative;overflow:hidden;
  background:repeating-radial-gradient(ellipse at 22% 18%,rgba(255,255,255,.3) 0 1px,transparent 1px 4px),linear-gradient(150deg,var(--c1),var(--c2))}
.linkbar .th svg{position:absolute;inset:0;width:100%;height:100%}
.lb-t{font-size:8px;letter-spacing:.2em;color:var(--ink-soft)}
.lb-n{font-size:13.5px;font-weight:500;letter-spacing:.06em;margin-top:5px}
.open{margin-left:auto;border:0;cursor:pointer;display:flex;gap:7px;align-items:center;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink);padding:9px 14px 9px 13px;border-radius:99px;background:linear-gradient(#fff,#f2f7ff);box-shadow:0 2px 8px rgba(90,130,210,.25),inset 0 0 0 1px #fff;transition:.15s}
.open:hover{transform:translateY(-1px)}
.open svg{width:12px;height:12px;stroke:var(--ink);fill:none;stroke-width:1.6}

.case{margin-top:26px;font-size:8px;letter-spacing:.22em;color:#6b7f9d;text-align:center}
.mark{position:fixed;left:8px;bottom:6px;display:flex;gap:2px;align-items:flex-end;z-index:3}
.mark i{width:4px;background:#6aa6ff;border-radius:1px}
.avatar i{position:relative;overflow:hidden}
.avatar i[style*="url("]::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.6),rgba(159,183,232,.28) 45%,rgba(58,79,128,.4)),linear-gradient(160deg,rgba(255,255,255,.25),transparent 50%)}
.tape-photo{position:absolute;inset:0;display:none;background:center/cover no-repeat}
.tape-bg.photo .tape-photo{display:block}
.m-photo{position:absolute;inset:0;display:block;background:center/cover no-repeat}
.pvt{width:96px;height:56px;flex:none;border-radius:8px;border:1px solid #cfdcf5;background:#e6efff center/cover}
/* ===== 관리자 팝업 ===== */
.adm-back{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(40,60,100,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:14px}
.adm{width:min(860px,100%);height:min(560px,100%);display:flex;flex-direction:column;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.97),rgba(231,240,255,.92));border:1px solid #fff;box-shadow:0 20px 60px rgba(60,100,180,.35);overflow:hidden;font-family:var(--sans);color:var(--ink)}
.adm-h{padding:11px 16px;font-weight:700;font-size:13px;background:linear-gradient(#f6f9ff,#e4edfb);border-bottom:1px solid #d6e2f7;display:flex;justify-content:space-between;align-items:center}
.adm-x{width:22px;height:22px;border-radius:50%;border:1px solid #bccbe6;background:#fff;color:var(--ink-soft);cursor:pointer;font-size:14px;line-height:1}
.adm-b{flex:1;display:flex;min-height:0}
#aNav{width:190px;flex:none;padding:14px 10px;overflow:auto;border-right:1px solid #dbe6f8;display:flex;flex-direction:column;gap:4px}
#aNav button{text-align:left;border:1px solid transparent;background:none;padding:10px 14px;border-radius:99px;font:13px var(--sans);color:var(--ink);cursor:pointer}
#aNav button.on{background:linear-gradient(#fff,#e6efff);border-color:#cfdcf5;box-shadow:0 2px 8px rgba(90,130,210,.28);font-weight:700}
#aPane{flex:1;overflow:auto;padding:20px 22px}
#aPane h3{font-size:15px;font-weight:700}
#aPane .d{font-size:12px;color:var(--ink-soft);line-height:1.6;margin:8px 0 14px}
#aPane label{display:block;font-size:11.5px;color:var(--ink-soft);margin:10px 0 4px}
#aPane input[type=text],#aPane input[type=password]{width:100%;padding:9px 12px;border:1px solid #cfdcf5;border-radius:10px;background:#fff;color:var(--ink);font:13px var(--sans)}
#aPane input:focus{outline:2px solid var(--blue);border-color:transparent}
#aPane input[type=color]{width:100%;height:36px;border:1px solid #cfdcf5;border-radius:10px;background:#fff;padding:2px}
.ag2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ag3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.abtn{border:1px solid #bccbe6;background:linear-gradient(#fff,#eef4ff);color:var(--ink);border-radius:99px;padding:7px 14px;font:12px var(--sans);cursor:pointer}
.abtn.sq{width:32px;height:30px;padding:0;border-radius:50%}
.arow{display:flex;gap:6px;align-items:center}
.ach{background:rgba(255,255,255,.65);border:1px solid #e1eafa;border-radius:14px;padding:12px;margin-bottom:12px}
.ach .arow input{flex:1}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:#8aa0c8;color:#fff;font:500 10px var(--mono);display:grid;place-items:center}
.chk{display:flex!important;gap:6px;align-items:center;color:var(--ink)!important}
.adm-f{padding:9px 16px;border-top:1px solid #d6e2f7;background:#f3f7ff;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft);gap:10px}
.adm-f.err span{color:#c0392b}
.adm-save{border:0;border-radius:99px;padding:9px 22px;font:700 12px var(--sans);color:#fff;background:linear-gradient(#8fa6cc,#6b84ad);cursor:pointer;box-shadow:0 2px 8px rgba(70,100,160,.3)}
@media(max-width:640px){.adm-b{flex-direction:column}#aNav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid #dbe6f8;padding:8px}#aNav button{white-space:nowrap;padding:8px 12px}.ag3{grid-template-columns:1fr 1fr}}
.lkm{width:min(390px,100%);height:auto}
.lkb{padding:22px 24px 14px;text-align:center;background:radial-gradient(circle at 1px 1px,rgba(190,210,240,.6) 1px,transparent 1.4px) 0 0/10px 10px,#f8fbff}
.lkc{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:#6b84ad;background:linear-gradient(160deg,#fff,#dce8fb);box-shadow:0 0 0 3px #fff,0 6px 18px rgba(80,120,200,.3)}
.lkt{font-size:16px;font-weight:700}.lkn{font-size:12px;font-weight:700;margin-top:10px}
.lkb p{font-size:11.5px;color:var(--ink-soft);margin:6px 0 16px}
.lki{position:relative}
.lki input{width:100%;height:46px;border-radius:99px;border:2px solid #9db8e6;background:#fff;padding:0 46px 0 20px;font:14px var(--sans);color:var(--ink)}
.lki input:focus{outline:0;border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(106,166,255,.25)}
.lki .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--ink-soft);display:grid}
.lke{min-height:16px;margin-top:8px;font-size:11.5px;color:#c0392b}
.lkf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid #d6e2f7;background:#f3f7ff}
.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.open .lk-ico{display:none}.open.lk .lk-ico{display:block}
/* 마우스 커서 (물방울, 끝이 클릭 위치) */
*{cursor:url("cursor.png") 8 0,auto!important}
input[type=text],input[type=password]{cursor:text!important}
</style>
</head>
<body class="playing">
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<span class="spark" style="left:11%;top:5%;font-size:15px">✦</span>
<span class="spark" style="left:17%;top:6%;font-size:10px;animation-delay:.8s">✦</span>
<span class="spark" style="left:22%;top:8%;font-size:8px;animation-delay:1.5s">✦</span>
<span class="spark" style="left:25%;top:10%;font-size:7px;animation-delay:2.1s">✦</span>

<main>
  <!-- 프로필 -->
  <section class="wrap profile">
    <div class="tab" id="tab1">00 EVIDENCE</div>
    <div class="card">
      <div class="avatar"><i id="avatar"></i></div>
      <div>
        <div class="pname" id="pname"></div>
        <div class="phandle" id="phandle"></div>
      </div>
      <svg class="links-ico" width="20" height="12" viewBox="0 0 20 12" fill="none" stroke="#3a4a66" stroke-width="1.2"><circle cx="6" cy="6" r="4.6"/><circle cx="14" cy="6" r="4.6"/></svg>
    </div>
  </section>

  <!-- 레코더 -->
  <section class="wrap recorder">
    <div class="tab" id="tab2">00 &nbsp;VOICE RECORDER</div>
    <div class="card">
      <div class="model"><span>LUVLINK - CR-02</span><span class="dots"></span></div>

      <div class="tape-view">
        <div class="tape-bg" id="tape"><div class="tape-photo" id="tapeImg"></div>
          <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg">
            <!-- 카세트 외곽 -->
            <rect x="26" y="8" width="188" height="124" rx="9" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.75)" stroke-width="1"/>
            <g fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".7">
              <circle cx="33" cy="15" r="1.8"/><circle cx="207" cy="15" r="1.8"/>
              <circle cx="33" cy="125" r="1.8"/><circle cx="207" cy="125" r="1.8"/>
            </g>
            <!-- 라벨 -->
            <rect x="38" y="16" width="164" height="25" rx="3" fill="rgba(255,255,255,.88)"/>
            <rect x="44" y="21" width="9" height="9" rx="2" fill="#2a3f68"/>
            <path d="M48.5 23 L51.2 28.2 H45.8Z" fill="#fff"/>
            <text id="tapeLabel" x="58" y="28.3" font-family="DM Mono,monospace" font-size="5.6" letter-spacing="1.2" fill="#243a62" font-weight="500">SIDE A · JUST</text>
            <text x="178" y="28.8" font-family="DM Mono,monospace" font-size="4.4" letter-spacing=".8" fill="#6c7f9c">C-60</text>
            <rect x="38" y="35" width="164" height="1.4" fill="#243a62"/>
            <!-- 릴 창 -->
            <rect x="62" y="48" width="116" height="42" rx="21" fill="rgba(255,255,255,.2)" stroke="rgba(255,255,255,.85)" stroke-width="1"/>
            <!-- 왼쪽 릴 -->
            <circle cx="88" cy="69" r="13.5" fill="rgba(255,255,255,.35)"/>
            <g class="reel">
              <circle cx="88" cy="69" r="9.5" fill="#fff" stroke="#9db4dc" stroke-width=".8"/>

 c.getContext("2d").drawImage(bm,(bm.width-sw)/2,(bm.height-sh)/2,sw,sh,0,0,w,h);return c.toDataURL("image/jpeg",.85)}

const mkCur=async(f,m)=>{const bm=await createImageBitmap(f),k=m/Math.max(bm.width,bm.height),w=Math.max(1,Math.round(bm.width*k)),h=Math.max(1,Math.round(bm.height*k)),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bm,0,0,w,h);return c.toDataURL("image/png")};

 <div class="arow" style="margin-top:14px"><button class="abtn" data-a="test">연결 확인</button></div>`;
 if(tab==="pf")h=`<h3>프로필</h3><p class="d">맨 위 프로필 카드에 보이는 정보예요.</p>${fld("이름","PROFILE.name",D.PROFILE.name)}${fld("핸들","PROFILE.handle",D.PROFILE.handle)}${fld("상단 탭 이름 (비우면 숨김)","SITE.tab1",D.SITE.tab1??"00 EVIDENCE")}<label>프로필 이미지</label><div class="arow" style="gap:14px;align-items:center"><div class="avatar" style="width:72px;height:72px"><i style="display:block;width:100%;height:100%;border-radius:50%;background:center/cover,radial-gradient(circle at 30% 30%,#fff,#9fb7e8 45%,#3a4f80);${pend||D.PROFILE.img?`background-image:url('${pend||D.PROFILE.img}')`:""}"></i></div>
 <div><input type="file" id="aFile" data-f="1" accept="image/*" hidden><button class="abtn" data-a="pick">이미지 첨부</button> <button class="abtn" data-a="imgdel">제거</button>
 <div class="d" style="margin:6px 0 0">정사각형으로 잘라 400px로 줄여서 저장 시 함께 올라가요.</div></div></div>`;
 if(tab==="st")h=`<h3>사이트 문구</h3><p class="d">브라우저 탭 제목, 레코더 위 탭 이름, 레코더 하단 문구, 맨 아래 CASE 문구예요.</p>${fld("브라우저 탭 제목","SITE.title",D.SITE.title)}${fld("레코더 탭 이름 (비우면 숨김)","SITE.tab2",D.SITE.tab2??"00 \u00a0VOICE RECORDER")}

 if(tab==="mu")h=`<h3>음악</h3><p class="d">유튜브 링크를 넣으면 레코더의 <b>PLAY</b> 버튼으로 재생돼요. STOP은 정지예요.</p>${fld("유튜브 링크","SITE.music",D.SITE.music||"")}
 <label>음량 <b id="vv">${D.SITE.volume??70}</b></label><input type="range" data-p="SITE.volume" min="0" max="100" value="${D.SITE.volume??70}" style="width:100%;accent-color:#6aa6ff">

 if(tab==="ic"){const fs=pendIc.fav||D.SITE.favicon||"favicon.png",cs=pendIc.cur||D.SITE.cursor||"cursor.png",hm=D.SITE.cursorHot||"tc";
 h=`<h3>아이콘 · 커서</h3><p class="d">브라우저 탭 아이콘(파비콘)과 마우스 커서를 직접 올릴 수 있어요. 투명 배경 PNG를 권장해요. 저장해야 반영돼요.</p>
 <label>파비콘</label><div class="arow" style="gap:14px"><div class="pvt" style="width:64px;height:64px;background:#e6efff url('${fs}') center/contain no-repeat"></div>
 <div><input type="file" data-ic="fav" accept="image/*" hidden><button class="abtn" data-a="icpick" data-w="fav">파일 첨부</button> <button class="abtn" data-a="icdef" data-w="fav">기본으로</button>
 <div class="d" style="margin:6px 0 0">64×64 정사각형으로 맞춰서 올라가요.</div></div></div>
 <label style="margin-top:20px">마우스 커서</label><div class="arow" style="gap:14px"><div class="pvt" style="width:64px;height:64px;background:#e6efff url('${cs}') center/contain no-repeat;image-rendering:pixelated"></div>
 <div><input type="file" data-ic="cur" accept="image/*" hidden><button class="abtn" data-a="icpick" data-w="cur">파일 첨부</button> <button class="abtn" data-a="icdef" data-w="cur">기본으로</button></div></div>
 <div class="ag2"><div><label>크기 (가장 긴 변)</label><select data-ic="size" style="width:100%;padding:9px 12px;border:1px solid #cfdcf5;border-radius:10px;background:#fff;font:13px var(--sans);color:var(--ink)">
  ${[[20,"작게 (20px)"],[26,"보통 (26px)"],[32,"크게 (32px)"]].map(([v,n])=>`<option value="${v}" ${v===curSize?"selected":""}>${n}</option>`).join("")}</select></div>

  ${[["tc","위쪽 가운데 (뾰족한 끝)"],["tl","왼쪽 위 (화살표)"],["c","가운데"]].map(([v,n])=>`<option value="${v}" ${v===hm?"selected":""}>${n}</option>`).join("")}</select></div></div>
 <div id="curTest" class="pvt" style="width:100%;height:70px;margin-top:12px;display:grid;place-items:center;font-size:11.5px;color:var(--ink-soft)">여기에 마우스를 올려 커서를 확인해 보세요</div>`}
 if(tab==="ch")h=`<h3>채널 · 링크</h3><p class="d">카세트 한 개가 채널 하나예요. 순서를 바꾸고 고친 뒤 꼭 저장을 눌러 주세요.</p>`+D.CHANNELS.map((c,i)=>`<div class="ach" data-i="${i}">
 <div class="arow"><span class="num">${String(i+1).padStart(2,"0")}</span><input type="text" data-k="name" value="${esc(c.name)}" placeholder="링크바 이름">

/* GitHub API */
const url=(p=gh.path)=>{if(!gh.owner||!gh.repo||!gh.token)throw Error("계정 · 저장소 · 토큰을 입력해 주세요.");
 return `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${p.split("/").map(encodeURIComponent).join("/")}`};
const hd=()=>({Authorization:"Bearer "+gh.token,Accept:"application/vnd.github+json"});
async function getSha(p){const r=await fetch(url(p)+"?ref="+encodeURIComponent(gh.branch)+"&_="+Date.now(),{headers:hd(),cache:"no-store"});
 if(r.status===404)return null;if(r.status===401)throw Error("토큰이 올바르지 않아요.");if(!r.ok)throw Error("GitHub 오류 "+r.status);return(await r.json()).sha}
async function test(){try{stat("확인 중…");const sha=await getSha(gh.path);stat(sha?"연결됐어요. 설정 파일을 찾았어요.":"연결됐어요. 저장하면 설정 파일이 새로 만들어져요.")}catch(e){stat(e.message,1)}}
async function save(){try{if(!gh.token){tab="gh";paint()}stat("저장 중…");
 if(draft.SITE.music&&!vid(draft.SITE.music))throw Error("유튜브 링크를 확인해 주세요.");
 for(const c of draft.CHANNELS){
  if(c.pw){if(!c.url)throw Error("비밀번호를 걸려면 이동 URL도 입력해 주세요. ("+c.name+")");c.lock=await lockUrl(c.pw,c.url);c.url=""}
  else if(c.lock&&c.url)throw Error("잠긴 채널의 URL을 바꾸려면 비밀번호도 새로 입력해 주세요. ("+c.name+")");
  delete c.pw}
 if(pend){const ip=gh.path.replace(/[^/]*$/,"")+"profile.jpg",isha=await getSha(ip),ib={message:"admin: update profile image",branch:gh.branch,content:pend.split(",")[1]};if(isha)ib.sha=isha;
  const ir=await fetch(url(ip),{method:"PUT",headers:hd(),body:JSON.stringify(ib)});if(!ir.ok)throw Error("이미지 업로드 실패 ("+ir.status+")");
  draft.PROFILE.img="profile.jpg?v="+Date.now();pend=null}
 for(const c of draft.CHANNELS){if(c.tid&&pendCh[c.tid]){const ip=gh.path.replace(/[^/]*$/,"")+"thumb-"+c.tid+".jpg",isha=await getSha(ip),ib={message:"admin: thumbnail",branch:gh.branch,content:pendCh[c.tid].split(",")[1]};if(isha)ib.sha=isha;
  const ir=await fetch(url(ip),{method:"PUT",headers:hd(),body:JSON.stringify(ib)});if(!ir.ok)throw Error("썸네일 업로드 실패 ("+ir.status+")");
  c.img="thumb-"+c.tid+".jpg?v="+Date.now();delete pendCh[c.tid]}}
 for(const[k,fn,fl]of[["fav","site-favicon.png","favicon"],["cur","site-cursor.png","cursor"]]){if(pendIc[k]){const ip=gh.path.replace(/[^/]*$/,"")+fn,isha=await getSha(ip),ib={message:"admin: "+fn,branch:gh.branch,content:pendIc[k].split(",")[1]};if(isha)ib.sha=isha;
  const ir=await fetch(url(ip),{method:"PUT",headers:hd(),body:JSON.stringify(ib)});if(!ir.ok)throw Error(fn+" 업로드 실패 ("+ir.status+")");draft.SITE[fl]=fn+"?v="+Date.now();pendIc[k]=null}}
 const sha=await getSha(gh.path);
 const body={message:"admin: update "+gh.path,branch:gh.branch,content:btoa(unescape(encodeURIComponent(JSON.stringify(draft,null,2))))};if(sha)body.sha=sha;
 let r=await fetch(url(),{method:"PUT",headers:hd(),body:JSON.stringify(body)});
 if(r.status===409||r.status===422){const s2=await getSha(gh.path);if(s2)body.sha=s2;else delete body.sha;r=await fetch(url(),{method:"PUT",headers:hd(),body:JSON.stringify(body)})}
 if(!r.ok){const j=await r.json().catch(()=>({}));throw Error("저장 실패 ("+r.status+") "+(j.message||""))}
 stat("저장했어요. 사이트 반영까지 1~2분 걸릴 수 있어요.")}catch(e){stat(e.message,1)}}
